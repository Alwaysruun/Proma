<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="heading">
        <h1>Todo</h1>
        <p id="subtitle" class="subtitle">加载中…</p>
      </div>
      <div class="filters" role="tablist" aria-label="筛选任务">
        <button type="button" class="filter is-active" data-filter="open">进行中</button>
        <button type="button" class="filter" data-filter="completed">已完成</button>
        <button type="button" class="filter" data-filter="all">全部</button>
      </div>
    </header>
    <form id="create-form" class="create">
      <input id="new-title" class="input grow" type="text" placeholder="添加任务，按 Enter 创建" autocomplete="off" maxlength="500">
      <select id="new-priority" class="input priority" aria-label="优先级">
        <option value="high">高</option>
        <option value="medium" selected>中</option>
        <option value="low">低</option>
      </select>
      <input id="new-due" class="input due" type="datetime-local" aria-label="计划完成时间">
      <button type="submit" class="primary">添加</button>
    </form>
    <main class="content">
      <section class="list-pane">
        <div id="list" class="list"></div>
        <div id="empty" class="empty" hidden>
          <div class="empty-title">这里还没有任务</div>
          <div class="empty-hint">在上方输入内容，按 Enter 创建一个 Todo。</div>
        </div>
      </section>
      <aside id="detail" class="detail" hidden>
        <div class="detail-head">
          <span class="detail-kicker">任务详情</span>
          <button id="detail-close" type="button" class="icon-button" aria-label="关闭详情">×</button>
        </div>
        <label class="field">
          <span>标题</span>
          <input id="detail-title" class="input" type="text" maxlength="500">
        </label>
        <label class="field">
          <span>描述</span>
          <textarea id="detail-notes" class="input textarea" rows="4" placeholder="补充说明…"></textarea>
        </label>
        <div class="field-row">
          <label class="field">
            <span>优先级</span>
            <select id="detail-priority" class="input">
              <option value="high">高</option>
              <option value="medium">中</option>
              <option value="low">低</option>
            </select>
          </label>
          <label class="field">
            <span>分组</span>
            <select id="detail-group" class="input"></select>
          </label>
        </div>
        <label class="field">
          <span>计划完成时间</span>
          <input id="detail-due" class="input" type="datetime-local">
        </label>
        <div class="detail-meta" id="detail-meta"></div>
        <div class="detail-actions">
          <button id="detail-save" type="button" class="primary">保存</button>
          <button id="detail-toggle" type="button" class="secondary">标记完成</button>
          <button id="detail-delete" type="button" class="danger">删除</button>
        </div>
      </aside>
    </main>
  </div>
  <script src="/__proma__/bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
